server:
  port: 8070

spring:
  application:
    name: customer-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customer-service
              uri: http://customer-service:8084
              predicates:
                - Path=/api/customers/**

            - id: shop-service
              uri: http://shop-service:8082
              predicates:
                - Path=/api/shop/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka